<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas NoSQL</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .btn-action { margin-right: 4px; }
        #editSection { display: none; }
    </style>
</head>
<body>
<script src="/config.js"></script>

<div class="container mt-5">
    <h2 class="mb-4">Movie Manager <span class="badge badge-info">NoSQL</span></h2>

    <div class="row">
        <!-- Agregar película -->
        <div class="col-md-5">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Agregar Película</h5>
                    <form id="movieForm">
                        <div class="form-group">
                            <label for="movieTitle">Título:</label>
                            <input type="text" class="form-control" id="movieTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="movieYear">Año de lanzamiento:</label>
                            <input type="number" class="form-control" id="movieYear" required>
                        </div>
                        <div class="form-group">
                            <label for="movieGenre">Género:</label>
                            <input type="text" class="form-control" id="movieGenre" required>
                        </div>
                        <div class="form-group">
                            <label for="movieDirector">Director:</label>
                            <input type="text" class="form-control" id="movieDirector" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Agregar Película</button>
                    </form>
                </div>
            </div>

            <!-- Editar película -->
            <div class="card mt-3" id="editSection">
                <div class="card-body">
                    <h5 class="card-title">Editar Película</h5>
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="form-group">
                            <label for="editTitle">Título:</label>
                            <input type="text" class="form-control" id="editTitle" required>
                        </div>
                        <div class="form-group">
                            <label for="editYear">Año de lanzamiento:</label>
                            <input type="number" class="form-control" id="editYear" required>
                        </div>
                        <div class="form-group">
                            <label for="editGenre">Género:</label>
                            <input type="text" class="form-control" id="editGenre" required>
                        </div>
                        <div class="form-group">
                            <label for="editDirector">Director:</label>
                            <input type="text" class="form-control" id="editDirector" required>
                        </div>
                        <button type="submit" class="btn btn-success">Guardar Cambios</button>
                        <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Cancelar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Listado de películas -->
        <div class="col-md-7">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Listado de Películas</h5>
                    <div id="alertArea"></div>
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Título</th>
                            <th>Año</th>
                            <th>Género</th>
                            <th>Director</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="movieList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const movieForm = document.getElementById('movieForm');
    const editForm = document.getElementById('editForm');
    const movieList = document.getElementById('movieList');
    const editSection = document.getElementById('editSection');
    const alertArea = document.getElementById('alertArea');

    function showAlert(message, type) {
        alertArea.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="close" data-dismiss="alert">&times;</button>
        </div>`;
        setTimeout(() => { alertArea.innerHTML = ''; }, 3000);
    }

    function renderRow(movie) {
        const row = document.createElement('tr');
        row.id = `row-${movie.movie_id}`;
        row.innerHTML = `
            <td>${movie.title || ''}</td>
            <td>${movie.release_year || ''}</td>
            <td>${movie.genre || ''}</td>
            <td>${movie.director || ''}</td>
            <td>
                <button class="btn btn-sm btn-warning btn-action" onclick="startEdit('${movie.movie_id}', '${(movie.title || '').replace(/'/g, "\\'")}', ${movie.release_year || 0}, '${(movie.genre || '').replace(/'/g, "\\'")}', '${(movie.director || '').replace(/'/g, "\\'")}')">Editar</button>
                <button class="btn btn-sm btn-danger btn-action" onclick="deleteMovie('${movie.movie_id}')">Eliminar</button>
            </td>
        `;
        return row;
    }

    movieForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = document.getElementById('movieTitle').value;
        const release_year = parseInt(document.getElementById('movieYear').value);
        const genre = document.getElementById('movieGenre').value;
        const director = document.getElementById('movieDirector').value;

        try {
            const response = await fetch(`${window.API_URL}/movies`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, release_year, genre, director })
            });
            const result = await response.json();
            const movie = { movie_id: result.insertedId, title, release_year, genre, director };
            movieList.appendChild(renderRow(movie));
            movieForm.reset();
            showAlert('Película agregada correctamente', 'success');
        } catch (err) {
            showAlert('Error al agregar película', 'danger');
        }
    });

    function startEdit(id, title, year, genre, director) {
        document.getElementById('editId').value = id;
        document.getElementById('editTitle').value = title;
        document.getElementById('editYear').value = year;
        document.getElementById('editGenre').value = genre;
        document.getElementById('editDirector').value = director;
        editSection.style.display = 'block';
    }

    function cancelEdit() {
        editSection.style.display = 'none';
        editForm.reset();
    }

    editForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const id = document.getElementById('editId').value;
        const title = document.getElementById('editTitle').value;
        const release_year = parseInt(document.getElementById('editYear').value);
        const genre = document.getElementById('editGenre').value;
        const director = document.getElementById('editDirector').value;

        try {
            await fetch(`${window.API_URL}/movies/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, release_year, genre, director })
            });
            await loadMovies();
            cancelEdit();
            showAlert('Película actualizada correctamente', 'success');
        } catch (err) {
            showAlert('Error al actualizar película', 'danger');
        }
    });

    async function deleteMovie(id) {
        if (!confirm('¿Eliminar esta película?')) return;
        try {
            await fetch(`${window.API_URL}/movies/${id}`, { method: 'DELETE' });
            const row = document.getElementById(`row-${id}`);
            if (row) row.remove();
            showAlert('Película eliminada', 'success');
        } catch (err) {
            showAlert('Error al eliminar película', 'danger');
        }
    }

    async function loadMovies() {
        movieList.innerHTML = '';
        try {
            const response = await fetch(`${window.API_URL}/movies`);
            const movies = await response.json();
            movies.forEach((movie) => {
                movieList.appendChild(renderRow(movie));
            });
        } catch (err) {
            showAlert('Error al cargar películas. Verificá que la API esté corriendo.', 'danger');
        }
    }

    loadMovies();
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
